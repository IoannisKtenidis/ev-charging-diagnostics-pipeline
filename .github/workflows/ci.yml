name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics-pipeline:
    name: Test LogBERT Diagnostics Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mlflow bentoml ocpp websockets

      - name: Run Diagnostics Pipeline Test
        run: |
          python tests/ocpp-server/anomaly_detection/test_pipeline.py

  ocpp-mock-server:
    name: Test OCPP Mock Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/ocpp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Server Tests
        run: poetry run pytest -v

  docker-validation:
    name: Validate Docker Compose & Build ML Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker ML Diagnostics Image
        run: docker build -t ocpp-ml:test -f docker/Dockerfile.ml .
